---
-
 name: Install Docker
 hosts: all
 become: yes
 vars:
  docker_packages:
   - docker-ce
   - docker-ce-cli
   - containerd.io
   - docker-buildx-plugin
   - docker-compose-plugin

 tasks:
  - name: Creating Ubuntu dependencies
    when: ansible_distribution == "Ubuntu"
    block:
      - name: install dependencies only for Ubuntu
        apt:
          name: "{{item}}"
          state: present
          update_cache: yes
        loop:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg-agent
          - software-properties-common
          - git

      - name: add GPG key
        apt_key:
          url: https://download.docker.com/linux/ubuntu/gpg
          state: present

      - name: add docker repository to apt Ubuntu
        apt_repository:
          repo: deb https://download.docker.com/linux/ubuntu bionic stable
          state: present

      - name: install docker Ubuntu
        apt:
         name: "{{docker_packages}}"
         state: latest
         update_cache: yes
    rescue:
      - debug:
          msg: "Caught a error, check dependecies for Ubuntu"


- name: Install Kubernetes
  hosts: all
  become: yes
  vars:
    k8s_packages:
      - kubelet
      - kubeadm
      - kubectl
  tasks:
    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download and dearmor Kubernetes key
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.35/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-key.gpg

    - name: Convert key to gpg format
      command: gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /etc/apt/keyrings/kubernetes-apt-key.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes repo
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.33/deb/ /"
        state: present
    - name: Update and upgrade apt
      apt:
        upgrade: yes
        update_cache: yes
        cache_valid_time: 86400
    - name: Install Kubernetes packages
      apt:
        name: "{{k8s_packages}}"
        state: latest
        update_cache: yes

- name: Fix containerd and swapoff
  hosts: all
  become: yes
  tasks:
    - name: Off swap 
      command: swapoff -a 

    - name: Disable SWAP in fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
        replace: '# \1'    

    - name: Create an empty file for K8S sysctl parameters
      copy:
        content: ""
        dest: /etc/sysctl.d/99-kubernetes-cri.conf
        force: no

    - name: Configure sysctl parameters for K8S
      lineinfile:
        path: /etc/sysctl.d/99-kubernetes-cri.conf
        line: "{{ item }}"
      loop:
        - "net.bridge.bridge-nf-call-iptables  = 1"
        - "net.ipv4.ip_forward                 = 1"
        - "net.bridge.bridge-nf-call-ip6tables = 1"

    - name: Apply sysctl parameters
      command: sysctl --system

    - name: Create config containerd
      command: containerd config default
      register: containerd_config
      args:
        creates: /etc/containerd/config.toml

    - name: Deploy containerd config
      template:
        src: containerd-config.toml.j2
        dest: /etc/containerd/config.toml
        owner: vladislav
        group: vladislav
        mode: '0644'

    - name: Start containerd
      service: name=containerd state=started daemon_reload=true enabled=yes

    - name: Set bridge-nf-call-iptables
      sysctl:
        name: net.bridge.bridge-nf-call-iptables
        value: 1

    - name: Set ip_forward
      sysctl:
        name: net.ipv4.ip_forward
        value: 1

    - name: Reboot
      reboot:
        reboot_timeout: 600

    - name: Wait for node to be reachable
      wait_for_connection:
        timeout: 300

- name: Initializing cluster
  hosts: masters[0]
  become: yes
  tasks:
    - name: Check if Kubernetes is already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: kubeadm_init
    - name: Initializing
      command: kubeadm init
      args:
        chdir: /home/vladislav
      when: not kubeadm_init.stat.exists

    - name: Create .kube directory
      file:
        path: /home/vladislav/.kube
        state: directory
        mode: 0755

    - name: Copy admin.conf to User's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/vladislav/.kube/config
        remote_src: yes
        owner: vladislav
        group: vladislav

    - name: Install Pod Network
      shell: kubectl apply -f https://reweave.azurewebsites.net/k8s/v1.33/net.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      when: not kubeadm_init.stat.exists

- name: Configure Join Commands on Master Node
  hosts: masters
  become: yes
  tasks:
    - name: Retrieve Join Command
      command: kubeadm token create --print-join-command
      register: join_command
      changed_when: false

    - name: Set Join Command
      set_fact:
        join_command: "{{ join_command.stdout }}"

- name: Join Worker Nodes
  hosts: workers
  become: yes
  tasks:
    - name: Check if kubelet.conf exists
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: stat_result

    - name: Enable TCP port 6443 (On Master) is able to connect from Worker
      wait_for:
        host: "{{ hostvars[groups['masters'][0]].ansible_host }}"
        port: 6443
        timeout: 10

    - name: Join worker to cluster
      shell: "{{ hostvars[groups['masters'][0]].join_command }}"
      args:
        chdir: /home/vladislav
      when: not stat_result.stat.exists

- name: Setup Kubernetes control plane metrics monitoring and secret for storageClass
  hosts: masters
  become: yes
  vars_files:
    - /tmp/yc-csi.json
  vars:
    local_pki_dir: "{{ playbook_dir }}/files/controlplane-metrics-pki"
    local_config_dir: "{{ playbook_dir }}/files/controlplane-metrics-configs"
    remote_pki_dir: /etc/kubernetes/pki
    cert_validity_days: 365
    monitoring_namespace: monitoring
  tasks:
  
    - name: Create local directories
      run_once: yes
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ local_pki_dir }}"
        - "{{ local_config_dir }}"

    - name: Generate controller-manager CSR config
      run_once: yes
      copy:
        content: |
          [ req ]
          default_bits       = 2048
          prompt             = no
          default_md         = sha256
          req_extensions     = v3_req
          distinguished_name = dn
          
          [ dn ]
          CN = system:kube-controller-manager
          
          [ v3_req ]
          keyUsage = critical,digitalSignature,keyEncipherment
          extendedKeyUsage = clientAuth
        dest: "{{ local_config_dir }}/cm-metrics-csr.conf"

    - name: Generate scheduler CSR config
      run_once: yes
      copy:
        content: |
          [ req ]
          default_bits       = 2048
          prompt             = no
          default_md         = sha256
          req_extensions     = v3_req
          distinguished_name = dn
          
          [ dn ]
          CN = system:kube-scheduler
          
          [ v3_req ]
          keyUsage = critical,digitalSignature,keyEncipherment
          extendedKeyUsage = clientAuth
        dest: "{{ local_config_dir }}/scheduler-metrics-csr.conf"

    - name: Generate controller-manager private key
      run_once: yes
      command: openssl genrsa -out {{ local_pki_dir }}/cm-metrics.key 2048
      args:
        creates: "{{ local_pki_dir }}/cm-metrics.key"

    - name: Generate controller-manager CSR
      run_once: yes
      command: >
        openssl req -new 
        -key {{ local_pki_dir }}/cm-metrics.key
        -out {{ local_pki_dir }}/cm-metrics.csr
        -config {{ local_config_dir }}/cm-metrics-csr.conf
      args:
        creates: "{{ local_pki_dir }}/cm-metrics.csr"

    - name: Generate controller-manager certificate
      run_once: yes
      command: >
        openssl x509 -req
        -in {{ local_pki_dir }}/cm-metrics.csr
        -CA {{ remote_pki_dir }}/ca.crt
        -CAkey {{ remote_pki_dir }}/ca.key
        -CAcreateserial
        -out {{ local_pki_dir }}/cm-metrics.crt
        -days {{ cert_validity_days }}
        -extensions v3_req
        -extfile {{ local_config_dir }}/cm-metrics-csr.conf
      args:
        creates: "{{ local_pki_dir }}/cm-metrics.crt"

    - name: Generate scheduler private key
      run_once: yes
      command: openssl genrsa -out {{ local_pki_dir }}/scheduler-metrics.key 2048
      args:
        creates: "{{ local_pki_dir }}/scheduler-metrics.key"

    - name: Generate scheduler CSR
      run_once: yes
      command: >
        openssl req -new
        -key {{ local_pki_dir }}/scheduler-metrics.key
        -out {{ local_pki_dir }}/scheduler-metrics.csr
        -config {{ local_config_dir }}/scheduler-metrics-csr.conf
      args:
        creates: "{{ local_pki_dir }}/scheduler-metrics.csr"

    - name: Generate scheduler certificate
      run_once: yes
      command: >
        openssl x509 -req
        -in {{ local_pki_dir }}/scheduler-metrics.csr
        -CA {{ remote_pki_dir }}/ca.crt
        -CAkey {{ remote_pki_dir }}/ca.key
        -CAcreateserial
        -out {{ local_pki_dir }}/scheduler-metrics.crt
        -days {{ cert_validity_days }}
        -extensions v3_req
        -extfile {{ local_config_dir }}/scheduler-metrics-csr.conf
      args:
        creates: "{{ local_pki_dir }}/scheduler-metrics.crt"

    - name: Create monitoring namespace
      shell: kubectl create namespace {{ monitoring_namespace }}
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Check kube-controlplane-metrics-certs secret
      run_once: yes
      shell: kubectl -n {{ monitoring_namespace }} get secret kube-controlplane-metrics-certs --ignore-not-found -o name
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: secret_check

    - name: Create Kubernetes secret with control plane certificates
      run_once: yes
      shell: >
        kubectl -n {{ monitoring_namespace }} create secret generic kube-controlplane-metrics-certs
        --from-file=ca.crt={{ remote_pki_dir }}/ca.crt
        --from-file=cm.crt={{ local_pki_dir }}/cm-metrics.crt
        --from-file=cm.key={{ local_pki_dir }}/cm-metrics.key
        --from-file=scheduler.crt={{ local_pki_dir }}/scheduler-metrics.crt
        --from-file=scheduler.key={{ local_pki_dir }}/scheduler-metrics.key
      when: secret_check.stdout == ""
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: true

    - name: Check controller-manager
      run_once: yes
      shell: kubectl get clusterrole allow-cm-metrics --ignore-not-found -o name
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cm_clusterrole_check

    - name: Apply controller-manager RBAC
      run_once: yes
      shell: |
        kubectl apply -f - <<EOF
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: allow-cm-metrics
        rules:
          - nonResourceURLs: ["/metrics"]
            verbs: ["get"]
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: allow-cm-metrics
        subjects:
          - kind: User
            name: system:kube-controller-manager
        roleRef:
          kind: ClusterRole
          name: allow-cm-metrics
          apiGroup: rbac.authorization.k8s.io
        EOF
      when: cm_clusterrole_check.stdout == ""
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: true

    - name: Check scheduler
      run_once: yes
      shell: >
        kubectl get clusterrole allow-scheduler-metrics --ignore-not-found -o name
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: scheduler_clusterrole_check

    - name: Apply scheduler RBAC
      run_once: yes
      shell: |
        kubectl apply -f - <<EOF
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: allow-scheduler-metrics
        rules:
          - nonResourceURLs: ["/metrics"]
            verbs: ["get"]
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: allow-scheduler-metrics
        subjects:
          - kind: User
            name: system:kube-scheduler
        roleRef:
          kind: ClusterRole
          name: allow-scheduler-metrics
          apiGroup: rbac.authorization.k8s.io
        EOF
      when: scheduler_clusterrole_check.stdout == ""
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: true

    - name: Check scrape config
      run_once: yes
      shell: >
        kubectl -n {{ monitoring_namespace }} get secret prometheus-additional-scrape-configs
        --ignore-not-found -o name
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: scrape_secret_check

    - name: Generate scrape config file
      run_once: yes
      copy:
        content: |
          - job_name: kube-controller-manager
            scheme: https
            static_configs:
              - targets: ["127.0.0.1:10257"]
            tls_config:
              ca_file: /etc/prometheus/secrets/kube-controlplane-metrics-certs/ca.crt
              cert_file: /etc/prometheus/secrets/kube-controlplane-metrics-certs/cm.crt
              key_file: /etc/prometheus/secrets/kube-controlplane-metrics-certs/cm.key
              insecure_skip_verify: true
          
          - job_name: kube-scheduler
            scheme: https
            static_configs:
              - targets: ["127.0.0.1:10259"]
            tls_config:
              ca_file: /etc/prometheus/secrets/kube-controlplane-metrics-certs/ca.crt
              cert_file: /etc/prometheus/secrets/kube-controlplane-metrics-certs/scheduler.crt
              key_file: /etc/prometheus/secrets/kube-controlplane-metrics-certs/scheduler.key
              insecure_skip_verify: true
          
          - job_name: kube-etcd
            scheme: http
            static_configs:
              - targets: ["127.0.0.1:2381"]
          
          - job_name: kube-proxy
            scheme: http
            static_configs:
              - targets: ["127.0.0.1:10249"]
        dest: "{{ local_config_dir }}/scrape-configs.yaml"
      when: scrape_secret_check.stdout == ""

    - name: Create scrape config secret
      run_once: yes
      shell: >
        kubectl -n {{ monitoring_namespace }} create secret generic prometheus-additional-scrape-configs
        --from-file=secret.yaml={{ local_config_dir }}/scrape-configs.yaml
      when: scrape_secret_check.stdout == ""
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: true
  
    - name: Create yc-sc secret
      run_once: yes
      shell: |
        kubectl apply -f - <<EOF
        apiVersion: v1
        kind: Secret
        metadata:
          name: csi-s3-secret
          namespace: kube-system
        type: Opaque
        stringData:
          accessKeyID: {{ access_key }}
          secretAccessKey: {{ secret_key }}
          endpoint: https://storage.yandexcloud.net
        EOF
      when: cm_clusterrole_check.stdout == ""
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: true

- name: Install ArgoCD
  hosts: masters
  become: yes
  vars_files:
    - vault.yml
  tasks:
    - name: Create current namespace
      command: kubectl create namespace argocd
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: ArgoCD download in cluster
      shell: kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.2.0/manifests/ha/install.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Clone gitlab
      git:
        repo: "https://oauth2:{{ gitlab_token }}@gitlab.com/solodium191/homelab-go.git"
        dest: /tmp/k8s-platform
        version: Infrastructure
        force: yes

    - name: Apply ArgoCD Applications
      shell: kubectl apply -f {{ item }}
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      loop:
        - /tmp/k8s-platform/Ingress-controller/Application.yaml
        - /tmp/k8s-platform/Keda/Application.yaml
        - /tmp/k8s-platform/gitlab-runner/Application.yaml
        - /tmp/k8s-platform/kube-prometheus-stack/Application.yaml
        - /tmp/k8s-platform/logging-with-opensearch/fluent/Application.yaml
        - /tmp/k8s-platform/logging-with-opensearch/opensearch/Application.yaml
        - /tmp/k8s-platform/logging-with-opensearch/opensearchdashboards/Application.yaml
        - /tmp/k8s-platform/storageclass-yc/Application.yaml
