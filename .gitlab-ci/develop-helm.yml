workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH != "develop"'
      when: never
    - when: always

stages:
  - build
  - scan
  - update-manifests

.build_template: &build_template
  stage: build
  tags: [test]
  image:
    name: gcr.io/kaniko-project/executor:v1.23.0-debug
    entrypoint: [""]
  artifacts:
    reports:
      dotenv: build.env


build_vote:
  <<: *build_template
  rules:
  - changes:
      - vote/**/*
    when: on_success
  script:
    - echo "SERVICE=vote" >> build.env
    - echo "IMAGE_TAG=$CI_COMMIT_SHA" >> build.env
    - echo "IMAGE_REPO=$CI_REGISTRY_IMAGE/vote" >> build.env

    - >
      /kaniko/executor
      --context "$CI_PROJECT_DIR/vote"
      --dockerfile "$CI_PROJECT_DIR/vote/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE/vote:$CI_COMMIT_SHA"
      --destination "$CI_REGISTRY_IMAGE/vote:latest"
      --cache=true
      --cache-repo "$CI_REGISTRY_IMAGE/cache"


build_result:
  <<: *build_template
  rules:
    - changes:
        - result/**/*
  script:
    - echo "SERVICE=result" >> build.env
    - echo "IMAGE_TAG=$CI_COMMIT_SHA" >> build.env
    - echo "IMAGE_REPO=$CI_REGISTRY_IMAGE/result" >> build.env

    - >
      /kaniko/executor
      --context "$CI_PROJECT_DIR/result"
      --dockerfile "$CI_PROJECT_DIR/result/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE/result:$CI_COMMIT_SHA"
      --destination "$CI_REGISTRY_IMAGE/result:latest"
      --cache=true
      --cache-repo "$CI_REGISTRY_IMAGE/cache"


build_worker:
  <<: *build_template
  rules:
    - changes:
        - worker/**/*
  script:
    - echo "SERVICE=worker" >> build.env
    - echo "IMAGE_TAG=$CI_COMMIT_SHA" >> build.env
    - echo "IMAGE_REPO=$CI_REGISTRY_IMAGE/worker" >> build.env

    - >
      /kaniko/executor
      --context "$CI_PROJECT_DIR/worker"
      --dockerfile "$CI_PROJECT_DIR/worker/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE/worker:$CI_COMMIT_SHA"
      --destination "$CI_REGISTRY_IMAGE/worker:latest"
      --cache=true
      --cache-repo "$CI_REGISTRY_IMAGE/cache"


.scan_images: &scan_images
  stage: scan
  tags: [test]
  image: aquasec/trivy:latest
  script:
    - trivy image --severity CRITICAL,HIGH --exit-code 1 "$CI_REGISTRY_IMAGE/${SERVICE}:$CI_COMMIT_SHA" --username "$CI_REGISTRY_USER" --password "$GITLAB_TOKEN" --format json -o trivy-report-${SERVICE}.json
  artifacts:
    when: always
    expire_in: 3days
    paths:
      - trivy-report-${SERVICE}.json

scan_image_vote:
  <<: *scan_images
  needs:
    - job: build_vote
      artifacts: true
  rules:
    - changes:
        - vote/**/*
      when: on_success

scan_image_result:
  <<: *scan_images
  needs:
    - job: build_result
      artifacts: true
  rules:
    - changes:
        - result/**/*
      when: on_success

scan_image_worker:
  <<: *scan_images
  needs:
    - job: build_worker
      artifacts: true
  rules:
    - changes:
        - worker/**/*
      when: on_success

.update_helm_template: &update_helm_template
  stage: update-manifests
  tags: [test]
  image: alpine:latest
  before_script:
    - apk add --no-cache git curl bash yq
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "GitLab CI"

  script:
    - git clone --branch k8s-manifests "https://oauth2:${GITLAB_TOKEN}@gitlab.com/solodium191/homelab-go.git" helm-manifests
    - cd helm-manifests/chart-homelab/values/
    - yq -i ".${SERVICE}.spec.imageTag = env(IMAGE_TAG)" develop.yaml
    - git add .
    - git commit -m "Update image tag for ${SERVICE} to ${IMAGE_TAG}" || echo "Nothing to commit"
    - git push origin k8s-manifests


update_vote:
  <<: *update_helm_template
  needs:
    - job: build_vote
      artifacts: true
    - job: scan_image_vote
  rules:
    - changes:
        - vote/**/*

update_result:
  <<: *update_helm_template
  needs:
    - job: build_result
      artifacts: true
    - job: scan_image_result
  rules:
    - changes:
        - result/**/*

update_worker:
  <<: *update_helm_template
  needs:
    - job: build_worker
      artifacts: true
    - job: scan_image_worker
  rules:
    - changes:
        - worker/**/*